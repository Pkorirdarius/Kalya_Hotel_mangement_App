name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USE_SQLITE: "false"
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Django system checks
        working-directory: backend
        run: python manage.py check
      - name: Migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Tests against Postgres
        working-directory: backend
        run: python -m pytest -q
      - name: Apply migrations for ops dry runs
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Retention policy dry run
        working-directory: backend
        run: python manage.py apply_retention --dry-run
      - name: Postgres backup/restore drill
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          python scripts/postgres_backup_restore.py drill
      - name: Staging settings check
        working-directory: backend
        run: python manage.py check --settings=config.settings.staging
      - name: Staging stack manifest check
        run: python scripts/check_staging_stack.py
      - name: Validate staging Compose file
        run: |
          cp .env.staging.example .env.staging
          docker compose -f docker-compose.staging.yml config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, lint, unit tests and brand check
        working-directory: frontend
        run: npm run check
      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Playwright specs a-g
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e
