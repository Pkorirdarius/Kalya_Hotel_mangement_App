openapi: 3.0.3
info:
  title: West Premier Hotel API
  version: 1.0.0
  description: Bilingual hotel website, booking and front desk API.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/common/health/:
    get:
      operationId: v1_common_health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/staff/auth/login/:
    post:
      operationId: v1_staff_auth_login_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/staff/auth/logout/:
    post:
      operationId: v1_staff_auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/staff/auth/me/:
    get:
      operationId: v1_staff_auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
